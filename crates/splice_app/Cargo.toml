[target.'cfg(target_os = "macos")'.dependencies]
apple_sys = { path = "../apple_sys" }
input = { path = "../../pxui/crates/open/input" }
metal_sys = { path = "../../pxui/crates/open/metal_sys" }
ogpu_core = { path = "../../pxui/crates/open/ogpu_core" }
